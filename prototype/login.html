<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 智云仓 WMS</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="login-page">

  <!-- 左：品牌区（Axure 里就是一张背景图 + 文字） -->
  <section class="login-art">
    <div class="art-grid" aria-hidden="true"></div>
    <div style="position:relative">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:36px">
        <span style="width:32px;height:32px;border-radius:8px;background:#2a78d6;display:grid;place-items:center;font-weight:700">仓</span>
        <b style="font-size:15px;letter-spacing:1px">智云仓 WMS</b>
      </div>
      <h1>仓库管理系统</h1>
      <p>覆盖入库收货、上架、拣货发运、库位管理、盘点与库龄分析的一体化仓储作业平台。</p>
    </div>
    <div class="art-stats">
      <div><b>4</b><span>在管仓库</span></div>
      <div><b>132</b><span>库位</span></div>
      <div><b>853.4 万</b><span>在库金额</span></div>
      <div><b>2.6 次</b><span>年周转</span></div>
    </div>
  </section>

  <!-- 右：登录表单 -->
  <section class="login-form-wrap">
    <form class="login-form" onsubmit="location.href='index.html#/dashboard';return false;">
      <h2>账号登录</h2>
      <p class="sub">请使用企业账号登录</p>

      <div class="field">
        <label for="acc">登录账号</label>
        <input class="input" id="acc" value="lina" autocomplete="username">
      </div>

      <div class="field">
        <label for="pwd">登录密码</label>
        <input class="input" id="pwd" type="password" value="123456" autocomplete="current-password">
      </div>

      <div class="field">
        <label for="wh">默认仓库</label>
        <select class="select" id="wh">
          <option>全部仓库</option>
          <option>WH01 原材料仓</option>
          <option>WH02 成品仓</option>
          <option>WH03 辅料仓</option>
          <option>WH04 不良品仓</option>
        </select>
      </div>

      <div class="row-between">
        <label class="row"><input type="checkbox" checked> 记住账号</label>
        <a href="#">忘记密码？</a>
      </div>

      <button class="btn primary block" type="submit">登 录</button>

      <div class="login-tip">
        <b>原型演示账号</b><br>
        lina / 123456 —— 仓库主管，可见全部菜单<br>
        直接点「登录」即可进入，密码不做校验。
      </div>
    </form>
  </section>

</div>

</body>
</html>
