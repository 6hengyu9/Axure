<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智云仓 WMS · 仓库管理系统原型</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<!-- ==========================================================================
     应用骨架 = Axure 的两个母版：① 顶栏母版  ② 左侧导航母版
     ========================================================================== -->
<div class="app">

  <!-- 母版①-左：品牌区 -->
  <div class="brand">
    <span class="logo" aria-hidden="true">仓</span>
    <span class="name">智云仓 WMS</span>
  </div>

  <!-- 母版①-右：顶栏 -->
  <header class="header">
    <button class="icon-btn" data-act="nav-collapse" title="折叠 / 展开导航" aria-label="折叠导航">☰</button>

    <button class="wh-switch" data-act="wh-switch">
      <span aria-hidden="true">▩</span>
      <span class="wh-label">全部仓库</span>
      <span aria-hidden="true" style="font-size:9px">▼</span>
    </button>

    <span class="spacer"></span>

    <button class="icon-btn" data-act="help" title="原型说明" aria-label="原型说明">?</button>
    <button class="icon-btn has-dot" data-act="notice" title="消息通知" aria-label="消息通知">🔔</button>

    <div class="user-chip" data-act="user-menu" role="button" tabindex="0">
      <span class="avatar">李</span>
      <span class="meta"><b>李娜</b><span>仓库主管</span></span>
      <span aria-hidden="true" style="font-size:9px;color:var(--ink-muted)">▼</span>
    </div>
  </header>

  <!-- 母版②：左侧导航（由 app.js 的 NAV 渲染） -->
  <nav class="nav" aria-label="主导航"></nav>

  <!-- 内容区：每次路由切换替换整块，等价于 Axure 的页面跳转 -->
  <main class="main"></main>

</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
